##
url = "/404"
layout = "default"
title = "404 - Page not found"

[viewBag]
localeUrl[de] = "/404"
localeTitle[de] = "404 - Seite nicht gefunden"
==
<section class="section section-page">
    <header class="py-6 bg-light dark:bg-dark">
        <div class="container">
            <div class="page-header">
                <h1 class="page-title text-center">{{ 'page.404.title'|trans }}</h1>
            </div>
        </div>
    </header>

    <article class="bg-white dark:bg-body py-8">
        <div class="container">
            <div class="page-content text-center">
                <h2 class="fs-1">{{ 'page.404.subtitle'|trans }}</h2>
                <p class="fs-5">
                    {{ 'page.404.comment'|trans }}
                </p>
                <a href="{{ 'home' | page }}" title="{{ 'page.404.button'|trans }}" class="btn btn-primary btn-lg">
                    {{ 'page.404.button'|trans }}
                </a>
            </div>
        </div>
    </article>
</section>

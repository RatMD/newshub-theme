<script>
    {% if this.theme.enable_dark_scheme %}
        var scheme = localStorage.getItem('newshub-color-scheme');
        if (scheme) {
            document.body.dataset.bsTheme = scheme === 'light' ? 'light': 'dark';
        }
    {% endif %}

    if (document.currentScript) {
        document.currentScript.remove();
    }
</script>
